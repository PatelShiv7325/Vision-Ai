services:
  - type: web
    name: vision-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PRODUCTION
        value: "1"
    disk:
      name: vision-ai-data
      mountPath: /data
      sizeGB: 5